<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>用户权限管理 · FJQ-48</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Datacenter · 前台管理</p>
          <h1>用户与权限</h1>
        </div>
        <div id="session-slot"></div>
      </header>

      <section id="login-panel" class="panel">
        <h2>登录</h2>
        <p class="hint">
          普通账号不能改机构 / 密码 / 角色。演示账号：
          <code>alice / alice123</code>（普通用户）、
          <code>admin / admin123</code>（管理员）。
        </p>
        <form id="login-form">
          <label>
            用户名
            <input name="username" autocomplete="username" required />
          </label>
          <label>
            密码
            <input
              name="password"
              type="password"
              autocomplete="current-password"
              required
            />
          </label>
          <button type="submit">进入管理台</button>
          <p id="login-error" class="error" hidden></p>
        </form>
      </section>

      <section id="app-panel" class="panel" hidden>
        <div class="policy-banner" id="policy-banner"></div>
        <div id="user-list"></div>
      </section>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
